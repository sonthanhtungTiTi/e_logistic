version: '3.8'

services:
  # ── 1. Redis Service (In-Memory Hot Cache Layer) ──────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: elogistics-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - elogistics_dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── 2. RabbitMQ Service (Message Broker & Write-Behind Queue) ─────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: elogistics-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP Protocol Port
      - "15672:15672"   # Management Web Dashboard Port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - elogistics_dev_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# ── Persistent Storage Volumes ────────────────────────────────────────────────
volumes:
  redis_data:
    name: elogistics_redis_dev_data
  rabbitmq_data:
    name: elogistics_rabbitmq_dev_data

# ── Isolated Internal Bridge Network ──────────────────────────────────────────
networks:
  elogistics_dev_network:
    name: elogistics_dev_network
    driver: bridge

